server:
  port: 8089

spring:
  application:
    name: report-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
  cache:
    cache-names:
      - dashboard
      - salesReports
      - productReports
      - customerReports
  caffeine:
    spec: maximumSize=500,expireAfterWrite=15m

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-0123456789abcdef}

app:
  internal-secret: ${APP_INTERNAL_SECRET:dev-only-insecure-internal-secret-0123456789abcdef}
  realtime:
    enabled: true
    channel: ${APP_REALTIME_CHANNEL:mexa:realtime:events}

services:
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8085}
  warehouse:
    url: ${WAREHOUSE_SERVICE_URL:http://localhost:8084}
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
