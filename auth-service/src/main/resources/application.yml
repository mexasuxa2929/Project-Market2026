server:
  port: 8081

spring:
  application:
    name: auth-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"
      allow-credentials: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/auth_db?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:mexa}
    password: ${SPRING_DATASOURCE_PASSWORD:mexa1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    table: auth_flyway_schema_history
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false
        transaction:
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
    hibernate:
      ddl-auto: none
    show-sql: false

logging:
  level:
    org.hibernate.orm.jdbc: ERROR
    org.hibernate.orm.core: WARN

jwt:
  secret: ${JWT_SECRET:mexa_jwt_2024_secret_key_32chars_long!!}
  expiration: ${JWT_EXPIRATION_MS:86400000}

app:
  internal-secret: ${APP_INTERNAL_SECRET:mexa_int_v1_R9x!2Qm#7Lp$4Tw@8Kd%1Nc^6Zh&3By*5Fu(0Ej)9Sa=2Vr+7Hg!4Px#8Lq$6Wt@1}
  jwt:
    access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL:900}
    refresh-token-ttl: ${APP_JWT_REFRESH_TOKEN_TTL:604800}
  swagger:
    username: ${APP_SWAGGER_USERNAME:swagger}
    password: ${APP_SWAGGER_PASSWORD:change-me-now}
    basic-auth:
      enabled: ${APP_SWAGGER_BASIC_AUTH_ENABLED:false}
  email-otp:
    ttl-seconds: ${EMAIL_OTP_TTL_SECONDS:300}
    resend-min-interval-seconds: ${EMAIL_OTP_RESEND_MIN_INTERVAL_SECONDS:60}
    max-attempts: ${EMAIL_OTP_MAX_ATTEMPTS:5}
    hash-secret: ${EMAIL_OTP_HASH_SECRET:change-me}
  mail:
    from: ${MAIL_FROM:no-reply@example.com}
  cleanup:
    enabled: ${APP_CLEANUP_UNVERIFIED_ENABLED:true}
    unverified-user-max-age-minutes: ${APP_UNVERIFIED_USER_MAX_AGE_MINUTES:60}
    scheduler-interval-ms: ${APP_CLEANUP_SCHEDULER_INTERVAL_MS:600000}
  refresh-token:
    ttl-seconds: ${APP_REFRESH_TOKEN_TTL_SECONDS:1209600}
    cookie:
      enabled: ${APP_REFRESH_TOKEN_COOKIE_ENABLED:true}
      name: ${APP_REFRESH_TOKEN_COOKIE_NAME:refreshToken}
      path: ${APP_REFRESH_TOKEN_COOKIE_PATH:/api/auth}
      same-site: ${APP_REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
      secure: ${APP_REFRESH_TOKEN_COOKIE_SECURE:false}
    cleanup:
      enabled: ${APP_REFRESH_TOKEN_CLEANUP_ENABLED:true}
      scheduler-interval-ms: ${APP_REFRESH_TOKEN_CLEANUP_INTERVAL_MS:600000}
  password-reset:
    ttl-minutes: ${APP_PASSWORD_RESET_TTL_MINUTES:15}
    reset-url-base: ${APP_PASSWORD_RESET_URL_BASE:https://domain.com/reset-password}
    cleanup:
      enabled: ${APP_PASSWORD_RESET_CLEANUP_ENABLED:true}
      scheduler-interval-ms: ${APP_PASSWORD_RESET_CLEANUP_INTERVAL_MS:600000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:989408291738-ficcbpvm7qkksfabogreqfj221sslrbo.apps.googleusercontent.com}
  realtime:
    enabled: true
    channel: ${APP_REALTIME_CHANNEL:mexa:realtime:events}

springdoc:
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:true}
    persist-authorization: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: list
    display-request-duration: true
    filter: true
  writer-with-default-pretty-printer: true

management:
  health:
    db:
      enabled: false
    redis:
      enabled: false
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:true}
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

