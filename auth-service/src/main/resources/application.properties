# Gmail SMTP (use an App Password: https://support.google.com/accounts/answer/185833)
# Sirlarni application-local.properties ga qo'ying: modul ildizi (./) yoki src/main/resources/ (classpath) — ikkalasi ham .gitignore da.
# Lokal dev uchun Mailpit: MAIL_HOST=localhost MAIL_PORT=1025 (http://localhost:8025 da ko'rinadi)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
jwt.secret=${JWT_SECRET:mexa_jwt_2024_secret_key_32chars_long!!}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
