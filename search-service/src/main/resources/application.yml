server:
  port: 8090

spring:
  application:
    name: search-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-0123456789abcdef}

app:
  search:
    elasticsearch:
      # H12: ES indeks qidiruvi faol (lokal dev'da ES yo'q bo'lsa dev profili:
      # -Dspring.profiles.active=dev — fallback qidiruv).
      enabled: true
    reindex-interval-ms: 600000
    reindex-initial-delay-ms: 30000
  internal-secret: ${APP_INTERNAL_SECRET:dev-only-insecure-internal-secret-0123456789abcdef}
  realtime:
    enabled: true
    channel: ${APP_REALTIME_CHANNEL:mexa:realtime:events}

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8083}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    elasticsearch:
      enabled: true
    redis:
      enabled: false
