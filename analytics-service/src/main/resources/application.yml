server:
  port: ${SERVER_PORT:8096}

spring:
  application:
    name: analytics-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        # JPA va Redis bir modulda: Redis repository skanini o'chiramiz (faqat pub/sub realtime-lib)
        enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/analytics_db}
    username: ${SPRING_DATASOURCE_USERNAME:mexa}
    password: ${SPRING_DATASOURCE_PASSWORD:mexa1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:mexa_jwt_2024_secret_key_32chars_long!!}

app:
  jwt:
    access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL:900}
  # Boshqa servislar (auth, order, discount) bilan bir xil — bo'lmasa X-Internal-Secret 403
  internal-secret: ${APP_INTERNAL_SECRET:mexa_int_v1_R9x!2Qm#7Lp$4Tw@8Kd%1Nc^6Zh&3By*5Fu(0Ej)9Sa=2Vr+7Hg!4Px#8Lq$6Wt@1}
  realtime:
    enabled: true
    channel: ${APP_REALTIME_CHANNEL:mexa:realtime:events}
  analytics:
    cache-ttl-minutes: ${ANALYTICS_CACHE_TTL_MINUTES:5}
    low-stock-threshold: ${ANALYTICS_LOW_STOCK_THRESHOLD:10}
    warehouse-internal-api-key: ${APP_INTERNAL_API_KEY:change-me-internal}
  services:
    order-url: ${ORDER_SERVICE_URL:http://localhost:8085}
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    warehouse-url: ${WAREHOUSE_SERVICE_URL:http://localhost:8084}
    discount-url: ${DISCOUNT_SERVICE_URL:http://localhost:8092}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 15000

springdoc:
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:true}
    persist-authorization: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: list
    display-request-duration: true
    filter: true
  writer-with-default-pretty-printer: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    redis:
      # Redis yo'q bo'lganda actuator stack trace chiqarmasligi uchun
      enabled: ${ANALYTICS_REDIS_HEALTH_ENABLED:false}

logging:
  level:
    # JDK 25 / Flyway PG18 / Hibernate dialect — ortiqcha ogohlantirishlarni kamaytirish
    org.hibernate.orm.deprecation: ERROR
    org.flywaydb.core.internal.database.base: ERROR
    org.springframework.data.repository.config.RepositoryConfigurationDelegate: WARN
