spring.application.name=WarehouseProject
server.port=${WAREHOUSE_SERVER_PORT:8084}
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.realtime.enabled=true
app.realtime.channel=${APP_REALTIME_CHANNEL:mexa:realtime:events}

# Database — prod da faqat env orqali bering
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/warehouse_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mexa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mexa1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.table=warehouse_flyway_schema_history
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=32
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Security — auth-service bilan bir xil maxfiy kalit (kamida 256 bit HS256 uchun yetarli string)
jwt.secret=${JWT_SECRET:mexa_jwt_2024_secret_key_32chars_long!!}

# Pagination defaults
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=200

# Logging
logging.level.mexa.club.warehouseproject=INFO
logging.level.org.springframework.security=WARN
# Hibernate: skema sinxronida "constraint yo'q" (HHH000247) takroriy WARNlarni kamaytirish
logging.level.org.hibernate.orm.jdbc=ERROR
logging.level.org.hibernate.orm.core=WARN

# Product service URL: application.yml → services.product.url (${PRODUCT_SERVICE_URL})
app.internal-api.key=${APP_INTERNAL_API_KEY:change-me-internal}

# Fayllar: storage/images/products/{productId}/... — kelajakda storage/images/{boshqa-modul}/...
app.storage.root=${APP_STORAGE_ROOT:storage}
app.storage.public-uri-prefix=/api/files
app.storage.max-image-bytes=5242880

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Swagger/OpenAPI (localhostda yoqib, prod'da APP_SWAGGER_ENABLED=false qilib o'chiring)
springdoc.api-docs.enabled=${APP_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${APP_SWAGGER_ENABLED:true}
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.docExpansion=list
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.writer-with-default-pretty-printer=true
app.swagger.username=${APP_SWAGGER_USERNAME:swagger}
app.swagger.password=${APP_SWAGGER_PASSWORD:change-me-now}
app.swagger.basic-auth.enabled=${APP_SWAGGER_BASIC_AUTH_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.health.defaults.enabled=true
management.health.db.enabled=false
management.health.diskspace.enabled=false
management.health.ping.enabled=true
management.health.redis.enabled=false
management.endpoint.health.show-details=never
