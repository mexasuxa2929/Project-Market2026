server:
  # Literal port so IntelliJ Services shows ": 8092"; override at runtime with env SERVER_PORT or -Dserver.port=...
  port: 8092

spring:
  application:
    name: discount-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/discounts_db}
    username: ${SPRING_DATASOURCE_USERNAME:mexa}
    password: ${SPRING_DATASOURCE_PASSWORD:mexa1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: ${JWT_SECRET}

app:
  jwt:
    access-token-ttl: ${APP_JWT_ACCESS_TOKEN_TTL:900}
  internal-secret: ${APP_INTERNAL_SECRET}
  realtime:
    enabled: true
    channel: ${APP_REALTIME_CHANNEL:mexa:realtime:events}

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8083}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

springdoc:
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:false}
    persist-authorization: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: list
    display-request-duration: true
    filter: true
  writer-with-default-pretty-printer: true
