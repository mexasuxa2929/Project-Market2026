      context: .
      dockerfile: product-service/Dockerfile
    container_name: warehouse-product-service
    environment:
      SPRING_DATASOURCE_URL: ${PRODUCT_SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/products_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-mexa}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-mexa1234}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-minio}
      APP_STORAGE_MINIO_ENDPOINT: ${APP_STORAGE_MINIO_ENDPOINT:-http://minio:9000}
      APP_STORAGE_MINIO_ACCESS_KEY: ${APP_STORAGE_MINIO_ACCESS_KEY:-minioadmin}
      APP_STORAGE_MINIO_SECRET_KEY: ${APP_STORAGE_MINIO_SECRET_KEY:-minioadmin}
      APP_STORAGE_MINIO_BUCKET: ${APP_STORAGE_MINIO_BUCKET:-product-images}
      APP_STORAGE_MINIO_PUBLIC_BASE_URL: ${APP_STORAGE_MINIO_PUBLIC_BASE_URL:-}
      REFERENCE_DATA_SERVICE_URL: ${REFERENCE_DATA_SERVICE_URL:-http://catalog-service:8086}
      SPRING_PROFILES_ACTIVE: ${PRODUCT_SPRING_PROFILES_ACTIVE:-default}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://order-service:8085}
      WAREHOUSE_SERVICE_URL: ${WAREHOUSE_SERVICE_URL:-http://warehouse-service:8084}
      SHOP_SERVICE_URL: ${SHOP_SERVICE_URL:-http://shop-service:8094}
      APP_INTERNAL_SECRET: ${APP_INTERNAL_SECRET:-change-me-internal}
      APP_INTERNAL_API_KEY: ${APP_INTERNAL_API_KEY:-change-me-internal}
    volumes:
      - ./storage:/app/storage
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
