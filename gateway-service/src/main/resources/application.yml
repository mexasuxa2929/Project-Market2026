server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cloud:
    gateway:
      routes:
        - id: swagger-auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/swagger/auth/**
          filters:
            - RewritePath=/swagger/auth/(?<segment>.*),/$\{segment}

        - id: swagger-product
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/swagger/product/**
          filters:
            - RewritePath=/swagger/product/(?<segment>.*),/$\{segment}

        - id: swagger-shop
          uri: ${SHOP_SERVICE_URL:http://localhost:8094}
          predicates:
            - Path=/swagger/shop/**
          filters:
            - RewritePath=/swagger/shop/(?<segment>.*),/$\{segment}

        - id: swagger-warehouse
          uri: ${WAREHOUSE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/swagger/warehouse/**
          filters:
            - RewritePath=/swagger/warehouse/(?<segment>.*),/$\{segment}

        - id: swagger-order
          uri: ${ORDER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/swagger/order/**
          filters:
            - RewritePath=/swagger/order/(?<segment>.*),/$\{segment}

        - id: swagger-notification
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/swagger/notification/**
          filters:
            - RewritePath=/swagger/notification/(?<segment>.*),/$\{segment}

        - id: swagger-delivery
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/swagger/delivery/**
          filters:
            - RewritePath=/swagger/delivery/(?<segment>.*),/$\{segment}

        - id: swagger-report
          uri: ${REPORT_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/swagger/report/**
          filters:
            - RewritePath=/swagger/report/(?<segment>.*),/$\{segment}

        - id: swagger-search
          uri: ${SEARCH_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/swagger/search/**
          filters:
            - RewritePath=/swagger/search/(?<segment>.*),/$\{segment}

        - id: swagger-payment
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/swagger/payment/**
          filters:
            - RewritePath=/swagger/payment/(?<segment>.*),/$\{segment}

        - id: swagger-discount
          uri: ${DISCOUNT_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/swagger/discount/**
          filters:
            - RewritePath=/swagger/discount/(?<segment>.*),/$\{segment}

        - id: swagger-analytics
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8096}
          predicates:
            - Path=/swagger/analytics/**
          filters:
            - RewritePath=/swagger/analytics/(?<segment>.*),/$\{segment}

        - id: swagger-geo
          uri: ${GEO_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/swagger/geo/**
          filters:
            - RewritePath=/swagger/geo/(?<segment>.*),/$\{segment}

        - id: payment-payme
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/payment/**
          filters:
            - StripPrefix=0

        - id: warehouse-api
          uri: ${WAREHOUSE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/warehouses/**,/api/audit-logs/**,/api/suppliers/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: auth-api
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: admin-api
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/users/**,/api/admin/roles,/api/admin/roles/**,/api/admin/groups/**,/api/admin/groups/*/members/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: shops-api
          uri: ${SHOP_SERVICE_URL:http://localhost:8094}
          predicates:
            - Path=/api/shops/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: products-admin-to-product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/products/**
            - RoleRoute=ROLE_ADMIN,ROLE_SUPER_ADMIN
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: products-default-to-shop-service
          uri: ${SHOP_SERVICE_URL:http://localhost:8094}
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: catalog-api
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/brands/**,/api/categories/**,/api/manufacturers/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: files-api
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/files/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: orders-api
          uri: ${ORDER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/orders/**,/api/admin/orders/**,/internal/orders/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: notifications-api
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/notifications/**,/api/admin/notifications/**,/api/admin/templates/**,/internal/notifications/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: deliveries-api
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/deliveries/**,/api/delivery/**,/api/admin/deliveries/**,/api/admin/couriers/**,/api/courier/deliveries/**,/internal/deliveries/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: reports-api
          uri: ${REPORT_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/reports/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: search-api
          uri: ${SEARCH_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/search/**,/internal/search/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: discount-api
          uri: ${DISCOUNT_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/api/discounts/**,/api/admin/promotions/**,/internal/discounts/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: analytics-api
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8096}
          predicates:
            - Path=/api/admin/analytics/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

        - id: geo-api
          uri: ${GEO_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/api/admin/geo-zones/**,/internal/geo-zones/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
                key-resolver: "#{@userOrIpKeyResolver}"

jwt:
  secret: ${JWT_SECRET:mexa_jwt_2024_secret_key_32chars_long!!}

app:
  rate-limiter:
    enabled: true
  realtime:
    channel: ${APP_REALTIME_CHANNEL:mexa:realtime:events}
    sse:
      enabled: true

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: auth
        url: /swagger/auth/v3/api-docs
      - name: product
        url: /swagger/product/v3/api-docs
      - name: shop
        url: /swagger/shop/v3/api-docs
      - name: warehouse
        url: /swagger/warehouse/v3/api-docs
      - name: order
        url: /swagger/order/v3/api-docs
      - name: notification
        url: /swagger/notification/v3/api-docs
      - name: delivery
        url: /swagger/delivery/v3/api-docs
      - name: report
        url: /swagger/report/v3/api-docs
      - name: search
        url: /swagger/search/v3/api-docs
      - name: payment
        url: /swagger/payment/v3/api-docs
      - name: discount
        url: /swagger/discount/v3/api-docs
      - name: analytics
        url: /swagger/analytics/v3/api-docs
      - name: geo
        url: /swagger/geo/v3/api-docs
    urls-primary-name: auth
