# PostgreSQL: orders_db mavjud bo'lmasa (IntelliJ Database yoki psql):
#   CREATE DATABASE orders_db;
# Keyin ushbu datasource bilan ulanadi — Flyway V1__init_orders.sql jadvallarni yaratadi.

server:
  port: 8085

spring:
  application:
    name: order-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/orders_db}
    username: ${SPRING_DATASOURCE_USERNAME:mexa}
    password: ${SPRING_DATASOURCE_PASSWORD:mexa1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: order_flyway_schema_history
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 10000

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

jwt:
  secret: ${JWT_SECRET}

app:
  internal-secret: ${APP_INTERNAL_SECRET}
  shop:
    internal-api-key: ${SHOP_INTERNAL_API_KEY:dev-only-insecure-internal-api-key-0123456789}
  realtime:
    enabled: true
    channel: ${APP_REALTIME_CHANNEL:mexa:realtime:events}
  # warehouse-service Flyway V5 default ombor bilan bir xil UUID (boshqa muhitda WAREHOUSE_DEFAULT_ID)
  warehouse:
    default-id: ${WAREHOUSE_DEFAULT_ID:11111111-1111-4111-8111-111111111111}

services:
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
  warehouse:
    url: ${WAREHOUSE_SERVICE_URL:http://localhost:8084}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
  discount:
    url: ${DISCOUNT_SERVICE_URL:http://localhost:8092}
  shop:
    url: ${SHOP_SERVICE_URL:http://localhost:8094}
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  delivery:
    url: ${DELIVERY_SERVICE_URL:http://localhost:8088}
  geo:
    url: ${GEO_SERVICE_URL:http://localhost:8095}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8091}

springdoc:
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
